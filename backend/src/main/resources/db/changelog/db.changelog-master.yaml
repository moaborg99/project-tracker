databaseChangeLog:
  - changeSet:
      id: 001-create-projects
      author: project-tracker
      changes:
        - createTable:
            tableName: projects
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-add-project-fields
      author: project-tracker
      changes:
        - addColumn:
            tableName: projects
            columns:
              - column:
                  name: description
                  type: VARCHAR(1000)

              - column:
                  name: status
                  type: VARCHAR(50)

              - column:
                  name: priority
                  type: VARCHAR(50)

              - column:
                  name: completed_tasks
                  type: INT

              - column:
                  name: total_tasks
                  type: INT

              - column:
                  name: due_date
                  type: DATE

              - column:
                  name: start_date
                  type: DATE
  - changeSet:
      id: 003-seed-projects
      author: project-tracker
      context: dev
      changes:
        - loadData:
            file: db/seed/projects.csv
            tableName: projects
            separator: ','
